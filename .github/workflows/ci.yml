name: Validate Shared Maze Puzzle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/app-v2.js
          node --check js/navigation-model.js
          node --check js/map-expansion.js
          node --check js/content-model.js
          node --check js/reusable-content-pack.js
          node --check js/content-outcomes.js
          node --check js/content-engine.js
          node --check js/dsa41-exploration.js
          node --check js/dsa41-hazards.js
          node --check js/dsa41-encounters.js
          node --check js/secret-connections.js
          node --check js/content-controller.js
          node --check js/crawler-view.js
          node --check js/crawler-controller.js
          node --check js/exploration-controller.js
          node --check js/direction-ui.js
          node --check js/map-readability.js
          node --check js/gm-route.js
          node --check js/gm-route-v2.js
      - name: Validate maps and cipher references
        run: node tests/validate.mjs
      - name: Validate direction geometry and cipher semantics
        run: node tests/direction-semantics.mjs
      - name: Validate frontend and backend graph parity
        run: node tests/backend-edge-parity.mjs
      - name: Validate decision-node parity
        run: node tests/decision-parity.mjs
      - name: Validate unique shortest band route
        run: node tests/route-uniqueness.mjs
      - name: Validate all solution-node pair detours
        run: node tests/solution-pair-safety.mjs
      - name: Validate wrong-turn behavior
        run: node tests/deviations.mjs
      - name: Validate crawler facing and sightline semantics
        run: node tests/crawler-view.mjs
      - name: Validate grid decision and transit semantics
        run: node tests/navigation-model.mjs
      - name: Validate expanded dungeon safety
        run: node tests/expanded-map.mjs
      - name: Validate danger and content semantics
        run: node tests/content-model.mjs
      - name: Validate reusable core content pack
        run: node tests/reusable-content-pack.mjs
      - name: Validate seeded reusable content engine
        run: node tests/content-engine.mjs
      - name: Validate structured content outcomes
        run: node tests/content-outcomes.mjs
      - name: Report scene content coverage
        run: node tests/content-coverage.mjs
      - name: Guard content density
        run: node tests/content-density.mjs
      - name: Validate spatial content lifecycle
        run: node tests/spatial-content.mjs
      - name: Validate hidden object payload lifecycle
        run: node tests/secret-payloads.mjs
      - name: Validate DSA 4.1 exploration checks
        run: node tests/dsa41-exploration.mjs
      - name: Validate DSA 4.1 hazard resolution
        run: node tests/dsa41-hazards.mjs
      - name: Validate reusable encounter archetypes
        run: node tests/dsa41-encounters.mjs
      - name: Validate hidden connection lifecycle
        run: node tests/secret-connections.mjs
      - name: Validate discoverable room features
        run: node tests/room-features.mjs
