<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Zeichen des verlorenen Weges</title><desc id="desc">Komplexe Linien- und Punktglyphe aus drei ineinandergreifenden Segmentgruppen.</desc>
  <rect width="1200" height="800" fill="#e9dec0"/><rect x="42" y="42" width="1116" height="716" rx="18" fill="none" stroke="#302a22" stroke-width="5"/>
  <text x="82" y="108" font-family="serif" font-size="42" fill="#2c2720">Zeichen des verlorenen Weges</text>
  <text x="82" y="148" font-family="serif" font-size="23" fill="#5b503d">Abzeichnung der Schwelle · Orientierung beibehalten</text>
  <g transform="translate(600 430)" fill="none" stroke="#25231f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -230 L145 -145 L145 5 L245 64 L145 122 L145 220"/>
    <path d="M0 -230 L-145 -145 L-145 5 L-245 64 L-145 122 L-145 220"/>
    <path d="M-145 5 L0 88 L145 5"/>
    <path d="M-145 122 L0 38 L145 122"/>
    <path d="M0 -88 L0 38 M0 88 L0 220"/>
  </g>
  <g fill="#25231f">
    <circle cx="600" cy="200" r="19"/><circle cx="455" cy="285" r="19"/><circle cx="745" cy="285" r="19"/>
    <circle cx="355" cy="494" r="19"/><circle cx="845" cy="494" r="19"/><circle cx="600" cy="650" r="19"/>
  </g>
  <g stroke="#7d352d" stroke-width="8" stroke-linecap="round">
    <line x1="479" y1="351" x2="500" y2="363"/><line x1="700" y1="363" x2="721" y2="351"/><line x1="590" y1="557" x2="610" y2="557"/>
  </g>
  <g font-family="sans-serif" font-size="22" fill="#4d4333">
    <text x="92" y="685">Notiz am Rand: Linien schneiden einander nicht zufällig.</text>
    <text x="92" y="718">Drei Stellen zeigen abweichenden Abrieb im Stein.</text>
