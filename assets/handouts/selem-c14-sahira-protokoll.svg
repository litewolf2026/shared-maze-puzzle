<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sahiras Richtungsprotokoll</title><desc id="desc">Arbeitsblatt mit absoluten Richtungen, Zeitmarken, gestrichenen Erinnerungsaussagen und dem Leitsatz Nicht erinnern – belegen.</desc>
  <rect width="1200" height="800" fill="#eee2c3"/><rect x="48" y="48" width="1104" height="704" rx="14" fill="none" stroke="#332c22" stroke-width="5"/>
  <text x="86" y="112" font-family="serif" font-size="42" fill="#2b261f">Arbeitsprotokoll · S.</text>
  <text x="86" y="151" font-family="serif" font-size="23" fill="#5c503d">Nicht erinnern – belegen.</text>
  <g stroke="#776b56" stroke-width="2"><line x1="88" y1="205" x2="1110" y2="205"/><line x1="88" y1="266" x2="1110" y2="266"/><line x1="88" y1="327" x2="1110" y2="327"/><line x1="88" y1="388" x2="1110" y2="388"/><line x1="88" y1="449" x2="1110" y2="449"/><line x1="88" y1="510" x2="1110" y2="510"/><line x1="88" y1="571" x2="1110" y2="571"/></g>
  <g font-family="sans-serif" font-size="22" fill="#332d24">
    <text x="100" y="191">Marke</text><text x="235" y="191">Richtung</text><text x="405" y="191">materieller Befund</text><text x="842" y="191">Erinnerung</text>
    <text x="100" y="244">I</text><text x="235" y="244">SO</text><text x="405" y="244">Wachs frisch / Kante alt</text><text x="842" y="244">„Tor war verschlossen“</text>
    <text x="100" y="305">II</text><text x="235" y="305">S</text><text x="405" y="305">Kreidestrich an Schwelle</text><text x="842" y="305">„zum ersten Mal hier“</text>
    <text x="100" y="366">III</text><text x="235" y="366">SO</text><text x="405" y="366">Blatt bereits nummeriert</text><text x="842" y="366">„Nummerierung neu“</text>
    <text x="100" y="427">IV</text><text x="235" y="427">S</text><text x="405" y="427">Fassung: Entnahme belegt</text><text x="842" y="427">„Auge nie entfernt“</text>
    <text x="100" y="488">V</text><text x="235" y="488">—</text><text x="405" y="488">Zeugin widerspricht These</text><text x="842" y="488">nicht verwerten</text>
    <text x="100" y="549">VI</text><text x="235" y="549">—</text><text x="405" y="549">Widerspruch bleibt</text><text x="842" y="549">Ritual muss enger werden</text>
  </g>
  <g stroke="#8a3b32" stroke-width="5"><line x1="836" y1="227" x2="1087" y2="252"/><line x1="836" y1="288" x2="1087" y2="313"/><line x1="836" y1="349" x2="1087" y2="374"/><line x1="836" y1="410" x2="1087" y2="435"/></g>
  <rect x="88" y="612" width="1020" height="82" fill="#d8c9a3" stroke="#514633" stroke-width="3"/>
  <text x="115" y="664" font-family="serif" font-size="34" fill="#2e2820">Zielbehauptung: Maruban nahm das Auge nicht aus der Fassung.</text>
  <text x="86" y="726" font-family="serif" font-size="22" fill="#514635">Rand: Nicht größer machen als nötig. Jede zusätzliche Behauptung schafft neue Widersprüche.</text>
</svg>